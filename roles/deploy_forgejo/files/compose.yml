services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${APP_VERSION}
    container_name: forgejo
    hostname: forgejo
    user: ${APP_USER}:${APP_GROUP}
    environment:
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=forgejo
      - FORGEJO__server__ROOT_URL=https://${APP_HOST}/
      - FORGEJO__server__SSH_DOMAIN=${APP_HOST}
      - FORGEJO__server__DOMAIN=${APP_HOST}
      - FORGEJO__mailer__ENABLED=true
      - FORGEJO__mailer__PROTOCOL=smtp
      - FORGEJO__mailer__SMTP_ADDR=mail-relay
      - FORGEJO__mailer__SMTP_PORT=2525
      - FORGEJO__mailer__FROM=forgejo@modestlab.dev
      - FORGEJO__mailer__USER=
      - FORGEJO__mailer__PASSWD=
      - FORGEJO__service__ENABLE_NOTIFY_MAIL=true
    restart: unless-stopped
    volumes:
      - ${APP_DATA_PATH}/data:/var/lib/gitea
      - ${APP_DATA_PATH}/conf:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - forgejo-db

  forgejo-db:
    image: postgres:${PG_VERSION}
    container_name: forgejo_pg
    hostname: forgejo_pg
    user: ${APP_USER}:${APP_GROUP}
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=forgejo
      - POSTGRES_DB=forgejo
    volumes:
      - ${APP_DATA_PATH}/postgres18:/var/lib/postgresql

networks:
  default:
    external: true
    name: nginxnetwork
