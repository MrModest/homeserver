---
- name: Set timezone
  become: true
  community.general.timezone:
    name: '{{ p_timezone }}'

- name: Update and upgrade apt packages
  become: true
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    cache_valid_time: 86400 # One day

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - python3
      - python3-pip
      - jq # to pipe jsons
      - bat # 'cat' replacement
      - acl # Access Control List
      - tmux # keep long cli sessions running with laptop turned off
      - ncdu # check free disk space
      - smartmontools # check disk health
      - intel-opencl-icd # Intel OpenCL runtime - for GPU acceleration in Jellyfin
    state: present
  become: true

- name: Install Node.js
  ansible.builtin.import_tasks: cronicle.yml
  become: true
  tags:
    - cronicle

- name: Install 'eza' # 'ls' and 'tree' replacement
  ansible.builtin.import_tasks: install_eza.yml
  become: true
  tags:
    - eza

- name: Install 'dops' # 'docker ps' alternative
  ansible.builtin.import_tasks: tasks/install_binary.yml
  vars:
    t_bin_name: 'dops'
    t_bin_version: '{{ isu_dops_version }}'
    t_bin_url: 'https://github.com/Mikescher/better-docker-ps/releases/download/v{{ isu_dops_version }}/dops_linux-amd64-static'
  tags:
    - dops

- name: Install 'hl' # JSON logs viewer
  ansible.builtin.import_tasks: tasks/install_binary.yml
  vars:
    t_bin_name: 'hl'
    t_bin_version: '{{ isu_hl_version }}'
    t_bin_url: 'https://github.com/pamburus/hl/releases/download/v{{ isu_hl_version }}/hl-linux-x86_64-musl.tar.gz'
    t_bin_archive_member: 'hl'
  tags:
    - hl

- name: Create 'hl' config directory
  ansible.builtin.file:
    path: /etc/hl
    state: directory
    owner: root
    group: root
    mode: '0755' # not the default '0754': every user needs '+x' to read the config inside
  become: true
  tags:
    - hl

- name: Setup 'hl' config # picked up automatically from the system-wide location
  ansible.builtin.template:
    src: hl-config.yaml.j2
    dest: /etc/hl/config.yaml
    owner: root
    group: root
    mode: '{{ p_default_permissions.file }}'
  become: true
  tags:
    - hl

- name: Setup aliases
  ansible.builtin.template:
    src: aliases.sh.j2
    dest: /etc/profile.d/aliases.sh
    owner: root
    group: root
    mode: '{{ p_default_permissions.file }}'
  become: true
  tags:
    - aliases

- name: Setup root aliases
  ansible.builtin.template:
    src: aliases.sh.j2
    dest: /root/.bash_aliases
    owner: root
    group: root
    mode: '0555'
  become: true
  tags:
    - aliases

- name: Setup tmux config
  ansible.builtin.template:
    src: tmux.conf.j2
    dest: '/home/{{ p_ssh_user.user }}/.config/tmux/tmux.conf'
    owner: '{{ p_ssh_user.user }}'
    group: '{{ p_ssh_user.group }}'
    mode: '{{ p_default_permissions.file }}'
  become: true
  tags:
    - tmux

- name: Clone a tmux plugin manager
  ansible.builtin.git:
    repo: 'https://github.com/tmux-plugins/tpm'
    dest: '/home/{{ p_ssh_user.user }}/.config/tmux/plugins/tpm'
    version: v3.1.0
    clone: true
    update: true
    force: true
  become: true
  become_user: '{{ p_ssh_user.user }}'
  tags:
    - tmux

- name: Add xterm support for 'kitty' and 'ghostty' terminal emulators
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/usr/share/terminfo/x/{{ item }}'
    mode: '0644'
    owner: root
    group: root
  become: true
  loop:
    - xterm-kitty
    - xterm-ghostty
  tags:
    - terminal
