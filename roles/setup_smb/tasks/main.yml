---
- name: Create datasets for SMB shares
  community.general.zfs:
    name: '{{ item.name }}'
    state: present
    extra_zfs_properties: '{{ item.properties }}'
  become: true
  loop:
    - name: '{{ g_pools.slow.custom_dirs.samba_ds }}'
      properties:
        mountpoint: '{{ g_pools.slow.custom_dirs.samba }}'
        compression: 'off'
        atime: 'off'
        xattr: 'on'
    - name: '{{ g_pools.slow.custom_dirs.time_machine_ds }}'
      properties:
        mountpoint: '{{ smb_share_root_path }}/time-machine'
        recordsize: '1M'
        compression: 'off'
        atime: 'off'
        xattr: 'on'
        refquota: '1T'

- name: Install Avahi for SMB discovery
  ansible.builtin.package:
    name: avahi-daemon
    state: present
  become: true

- name: Enable Avahi
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started
  become: true

- name: Configure samba
  ansible.builtin.include_role:
    name: vladgh.samba.server
    apply:
      become: true
  vars:
    samba_netbios_name: '{{ smb_hostname }}'
    samba_server_string: '{{ smb_hostname }}'
    samba_workgroup: WORKGROUP
    samba_server_min_protocol: SMB2
    samba_global_include: global-include.conf
    samba_load_homes: false
    samba_load_printers: false
    samba_create_varwww_symlinks: false
    samba_log: /var/log/samba.log
    samba_log_size: 60000
    samba_log_level: '3 passdb:5 auth:10 winbind:2 '
    samba_map_to_guest: Never
    samba_users:
      - name: '{{ smb_samba_user.user }}'
        password: '{{ smb_samba_user.password }}'
    samba_shares_root: '{{ smb_share_root_path }}'
    samba_shares:
      - name: samba
        path: '{{ g_pools.slow.custom_dirs.samba }}'
        owner: '{{ smb_samba_user.user }}'
        group: '{{ smb_samba_user.group }}'
        directory_mode: '0775'
        public: false
        comment: '{{ smb_hostname }} Samba'
        write_list: '+{{ smb_samba_user.group }}'
        valid_users: '+{{ smb_samba_user.group }}'
        browseable: true
      - name: time-machine
        owner: '{{ smb_samba_user.user }}'
        group: '{{ smb_samba_user.group }}'
        directory_mode: '0775'
        public: false
        write_list: '+{{ smb_samba_user.group }}'
        valid_users: '+{{ smb_samba_user.group }}'
        vfs_objects:
          - name: catia
          - name: fruit
            options:
              - name: time machine
                value: 'yes'
              - name: time machine max size
                value: '1T'
              - name: model
                value: 'MacSamba'
              - name: advertise_fullsync
                value: 'true'
              - name: posix_rename
                value: 'yes'
          - name: streams_xattr
        comment: '{{ smb_hostname }} TimeMachine'
        browseable: true
