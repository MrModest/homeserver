---
- name: Create ZFS dataset for 'hermes_notes'
  community.general.zfs:
    name: '{{ p_dirs.apps_data_ds }}/hermes_notes'
    state: present
  become: true

- name: Check if Hermes data directories exist
  # Guards the next task so it only chowns/chmods brand-new directories —
  # matching tasks/compose_up.yml's own `when: not dir.stat.exists` convention.
  # Without this guard, recurse: true would sweep the entire live hermes/
  # tree (item: '') on every run: the hermes container keeps most of it at
  # 700/600 owned by UID 10000 (auth.json, state.db, memories/*.md,
  # sessions.json, logs/), and re-chowning it to apps + p_default_permissions
  # every playbook run would both loosen those secrets to group/world-
  # readable and fight the container's own boot-time chown back to UID 10000.
  ansible.builtin.stat:
    path: '{{ p_dirs.apps_data }}/hermes_notes/hermes/{{ item }}'
  become: true
  loop:
    - ''
    - skills/note-taking/obsidian
    - skills/caveman/caveman
  register: t_hermes_dirs_stat

- name: Create Hermes data directory (if it does not exist)
  # Owned directly by the hermes runtime UID/GID (10000), not p_apps_user —
  # a container restart was confirmed NOT to retroactively chown pre-existing
  # bind-mounted directories to UID 10000 (only note-taking/, seeded on the
  # volume's very first boot, ended up hermes-owned; a later-added directory
  # stayed apps-owned and was invisible to the hermes process, which always
  # runs as UID 10000 and has no shared group with apps — no execute bit on
  # "other" meant it couldn't even traverse into the directory).
  ansible.builtin.file:
    path: '{{ p_dirs.apps_data }}/hermes_notes/hermes/{{ dir.item }}'
    state: directory
    owner: '{{ hnts_hermes_uid }}'
    group: '{{ hnts_hermes_gid }}'
    mode: '{{ p_default_permissions.directory }}'
    recurse: true
  become: true
  when: not dir.stat.exists
  loop: '{{ t_hermes_dirs_stat.results }}'
  loop_control:
    loop_var: dir

- name: Create Hermes' image cache directory (doubles as Hatchdoor's attachment staging dir)
  # hermes has no file/terminal toolset, so it can't copy a downloaded
  # Telegram image into a separate staging folder — Hatchdoor's compose.yml
  # mounts this same host path directly instead (see compose.yml comment).
  # Owned by hnts_hermes_uid/gid (10000) since hermes writes here directly;
  # hatchdoor (UID 65532, no shared group) only needs to read, so this needs
  # its own more permissive 0755 rather than compose_up.yml's shared 0754
  # default — 0754 has no execute bit for "other", which would block
  # hatchdoor from traversing it.
  ansible.builtin.file:
    path: '{{ p_dirs.apps_data }}/hermes_notes/hermes/cache/images'
    state: directory
    owner: '{{ hnts_hermes_uid }}'
    group: '{{ hnts_hermes_gid }}'
    mode: '0755'
  become: true

- name: Copy Hermes config/persona files
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ p_dirs.apps_data }}/hermes_notes/hermes/{{ item.dest }}'
    owner: '{{ hnts_hermes_uid }}'
    group: '{{ hnts_hermes_gid }}'
    mode: '{{ p_default_permissions.file }}'
  become: true
  loop:
    - {src: config.yaml, dest: config.yaml}
    - {src: SOUL.md, dest: SOUL.md}
    - {src: no-bundled-skills, dest: .no-bundled-skills}
    - {src: skills/note-taking/DESCRIPTION.md, dest: skills/note-taking/DESCRIPTION.md}
    - {src: skills/note-taking/obsidian/SKILL.md, dest: skills/note-taking/obsidian/SKILL.md}
    - {src: skills/caveman/DESCRIPTION.md, dest: skills/caveman/DESCRIPTION.md}
    - {src: skills/caveman/caveman/SKILL.md, dest: skills/caveman/caveman/SKILL.md}

- name: Allow root to operate on Hatchdoor's knowledge-vault repo despite UID mismatch
  # The repo ends up owned by hnts_hatchdoor_uid (see the ownership task
  # below), but this git task runs as root via become. Git refuses to
  # operate on a repo it doesn't own (CVE-2022-24765 "dubious ownership"
  # mitigation) unless the path is allow-listed — without this, the clone
  # succeeds on a fresh deploy (root creates + owns it) but every run after
  # fails permanently once the ownership task hands it to UID 65532.
  community.general.git_config:
    name: safe.directory
    scope: global
    value: '{{ p_dirs.apps_data }}/hermes_notes/hatchdoor/knowledge-vault'
    add_mode: add
  become: true

- name: Clone 'knowledge-vault' repo for Hatchdoor
  ansible.builtin.git:
    repo: "{{ hnts_knowledge_vault_repo | regex_replace('^https://', 'https://' ~ hnts_github_username ~ ':' ~ hnts_github_pat ~ '@') }}"
    dest: '{{ p_dirs.apps_data }}/hermes_notes/hatchdoor/knowledge-vault'
    version: '{{ hnts_hatchdoor_git_branch }}'
  become: true
  no_log: true

- name: Create Hatchdoor cache directory
  ansible.builtin.file:
    path: '{{ p_dirs.apps_data }}/hermes_notes/hatchdoor/cache'
    state: directory
    mode: '{{ p_default_permissions.directory }}'
  become: true

- name: Set Hatchdoor data directories ownership to the distroless nonroot UID/GID
  ansible.builtin.file:
    path: '{{ p_dirs.apps_data }}/hermes_notes/hatchdoor/{{ item }}'
    state: directory
    owner: '{{ hnts_hatchdoor_uid }}'
    group: '{{ hnts_hatchdoor_gid }}'
    recurse: true
  become: true
  loop:
    - knowledge-vault
    - cache

- name: Start 'hermes-notes'
  ansible.builtin.import_tasks: tasks/compose_up.yml
  vars:
    t_app_name: 'hermes_notes'
    t_app_data_dirs: []
