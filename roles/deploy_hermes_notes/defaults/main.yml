---
hnts_hermes_version: v2026.7.7.2
hnts_hatchdoor_version: v2.3.0

# The baked-in `hermes` user inside the hermes image. Confirmed a container
# restart does NOT retroactively chown pre-existing bind-mounted content to
# this UID/GID — that only happens (if at all) on a data volume's very first
# boot — so Ansible must own hermes' own files as this UID/GID directly
# rather than relying on the container to fix it up afterward.
hnts_hermes_uid: 10000
hnts_hermes_gid: 10000

hnts_telegram_bot_token: placeholder
hnts_telegram_allowed_users: placeholder

hnts_hatchdoor_web_bearer_token: placeholder
hnts_hatchdoor_mcp_bearer_token: placeholder
hnts_hatchdoor_mcp_enabled: true
hnts_hatchdoor_mcp_write_enabled: true
hnts_hatchdoor_attachment_staging_path: /data/attachments-inbox

hnts_hatchdoor_git_sync_enabled: true
hnts_hatchdoor_git_remote: origin
hnts_hatchdoor_git_branch: main
hnts_github_username: placeholder
hnts_github_pat: placeholder
hnts_hatchdoor_git_debounce_seconds: 30
hnts_hatchdoor_git_author_name: Hermes Agent
hnts_hatchdoor_git_author_email: hermes-agent@localhost

hnts_knowledge_vault_repo: placeholder
hnts_hatchdoor_uid: 65532
hnts_hatchdoor_gid: 65532
