---
hnts_hermes_version: v2026.9.14
hnts_hatchdoor_version: 2.6.1

# The baked-in `hermes` user inside the hermes image. Confirmed a container
# restart does NOT retroactively chown pre-existing bind-mounted content to
# this UID/GID — that only happens (if at all) on a data volume's very first
# boot — so Ansible must own hermes' own files as this UID/GID directly
# rather than relying on the container to fix it up afterward.
hnts_hermes_uid: 10000
hnts_hermes_gid: 10000

hnts_telegram_bot_token: placeholder
hnts_telegram_allowed_users: placeholder

hnts_hatchdoor_web_bearer_token: placeholder
hnts_hatchdoor_mcp_bearer_token: placeholder
hnts_hatchdoor_mcp_enabled: true
hnts_hatchdoor_mcp_write_enabled: true
# Every attachment size cap is pinned to 20 MiB — the same `20 * 1024 * 1024`
# hermes uses for inbound Telegram documents, which is itself the Telegram Bot
# API's getFile ceiling. Anything larger never reaches the agent at all, so a
# higher cap here could not be exercised. It also stays under GitHub's 25 MiB
# file limit, which matters because the vault is git-synced to GitHub.
hnts_attachment_max_bytes: 20971520
# Decoded-size cap for base64 uploads over MCP (upstream default is 5 MiB).
hnts_hatchdoor_mcp_max_base64_bytes: '{{ hnts_attachment_max_bytes }}'
# Cap for multipart uploads (web UI + file-relay); upstream default is 10 MiB.
hnts_hatchdoor_max_attachment_bytes: '{{ hnts_attachment_max_bytes }}'

# --- LLM provider (CLIProxyAPI) ---
# Base URL for the `openai-codex` provider, which Hermes reads from its process
# environment. It otherwise defaults to https://chatgpt.com/backend-api/codex,
# so a proxy key would be sent to ChatGPT itself and answered with a 401.
# Hermes appends `/responses`, so this ends at the proxy's /v1.
#
# The credential itself cannot be set here: `openai-codex` declares no API-key
# environment variable, so it is added once with `hermes auth` (Add a credential
# -> openai-codex) and lives in auth.json under the bind-mounted /opt/data.
# Deliberately absent: OPENAI_API_KEY. That variable belongs to the separate
# `openai-api` provider and its mere presence registers a second credential that
# competes with the Codex one.
hnts_hermes_codex_base_url: placeholder

# Firecrawl Cloud key for web_search / web_extract. Read from the process
# environment; config.yaml selects the backend and enables the plugin.
hnts_firecrawl_api_key: placeholder

hnts_relay_upload_url: http://hatchdoor:42824/api/attachment
hnts_relay_target_dir: 98_Attachments

# --- Hatchdoor vault registry (templates/vaults.json.j2) ---
# Only used to seed /data/state/vaults.json on a host that has none. Hatchdoor
# owns that file afterwards; these values do not track later edits made in
# Settings or through the `edit_vault` MCP tool.
# The id is the one v2.5.0's legacy import minted for the existing vault —
# pinning it keeps a rebuilt host addressing the same vault as before.
hnts_hatchdoor_vault_id: 0f56ee34-d304-4a67-b73d-523f40b90d27
hnts_hatchdoor_vault_name: vault
# How often a two-way vault talks to the remote. Hatchdoor's own default is
# 86400 (once a day); this is the successor to the retired 30s
# HATCHDOOR_GIT_DEBOUNCE_SECONDS, though it paces pushes, not commits.
hnts_hatchdoor_git_poll_interval_secs: 86400
# The vault's commit identity. No longer passed through .env — v2.5.0 moved it
# into the registry, so it reaches Hatchdoor only via the seed template.
hnts_hatchdoor_git_author_name: Hermes Agent
hnts_hatchdoor_git_author_email: hermes-agent@localhost

# Only the initial `git clone` still reads these. Git sync itself is configured
# per Vault inside Hatchdoor since v2.5.0 — remote, branch, credentials, commit
# identity and schedule all live in /data/state/vaults.json, and re-exporting
# the old HATCHDOOR_GIT_* variables would stop every Vault from activating.
hnts_hatchdoor_git_branch: main
hnts_github_username: placeholder
hnts_github_pat: placeholder

hnts_knowledge_vault_repo: placeholder
hnts_hatchdoor_uid: 65532
hnts_hatchdoor_gid: 65532
