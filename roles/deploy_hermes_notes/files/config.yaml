model:
  provider: openai-codex
  default: gpt-5.5
  base_url: https://chatgpt.com/backend-api/codex
agent:
  verify_on_stop: false
display:
  tool_preview_length: 0
  tool_progress: all
gateway:
  platforms:
    telegram:
      enabled: true
      session_reset:
        mode: idle
        idle_minutes: 30
        notify: true
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 33
mcp_servers:
  hatchdoor:
    url: http://hatchdoor:42824/mcp
    headers:
      Authorization: Bearer ${HATCHDOOR_MCP_BEARER_TOKEN}
    tools:
      resources: false
      prompts: false
toolsets_disabled:
  - web
  - terminal
  - file
  - browser
  - code_execution
platform_toolsets:
  telegram:
    - hatchdoor
    - memory
plugins:
  enabled: []
