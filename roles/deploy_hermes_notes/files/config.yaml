model:
  provider: openai-codex
  default: gpt-5.6-terra
agent:
  verify_on_stop: false
  # Hard suppression, applied last, overriding platform_toolsets and the
  # recovery paths that would otherwise re-add a toolset. Hermes reads this key
  # only under `agent:` -- a top-level `toolsets_disabled:` is silently ignored.
  # `file` and `terminal` staying off is what the file-relay MCP exists to work
  # around; see docs/superpowers/specs/2026-07-20-deploy-hermes-notes-design.md.
  disabled_toolsets:
    - terminal
    - file
    - browser
    - code_execution
display:
  tool_preview_length: 0
  tool_progress: all
gateway:
  platforms:
    telegram:
      enabled: true
      session_reset:
        mode: idle
        idle_minutes: 30
        notify: true
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 33
mcp_servers:
  hatchdoor:
    url: http://hatchdoor:42824/mcp
    headers:
      Authorization: Bearer ${HATCHDOOR_MCP_BEARER_TOKEN}
    tools:
      resources: false
      prompts: false
  file_relay:
    url: http://file-relay:8000/mcp
    tools:
      resources: false
      prompts: false
platform_toolsets:
  telegram:
    - hatchdoor
    - file_relay
    - memory
    - web
# Web search and extraction are plugin-provided. An empty list enables nothing,
# so web_search/web_extract have no backend and the `web` toolset above resolves
# to unusable tools.
plugins:
  enabled:
    - web-firecrawl
web:
  # Selects Firecrawl for both web_search and web_extract. Required even with a
  # key present: without an explicit selection the keyless cloud path is never
  # taken, and FIRECRAWL_API_KEY alone does not pick the backend.
  backend: firecrawl
