# Everything else is scraped by Alloy and pushed in over remote write. The two
# jobs below are deliberately native scrapes: they are what tells you Alloy
# itself has stopped feeding the stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    # Absorbs replays from Alloy's write-ahead log after either side restarts.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']
