---
# Loki's image defaults to USER 10001, but the uid is not baked into the binary:
# the container runs as the apps user, so the data it writes stays consistent
# with every other app's dataset.
- name: Create Loki conf directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    mode: '{{ p_default_permissions.directory }}'
    owner: '{{ p_apps_user.user }}'
    group: '{{ p_apps_user.group }}'
    recurse: true
  become: true
  loop:
    - '{{ p_dirs.apps_data }}/observability/loki'
    - '{{ p_dirs.apps_data }}/observability/loki/config'
    - '{{ p_dirs.apps_data }}/observability/loki/data'

- name: Copy Loki config file into the directory
  ansible.builtin.copy:
    src: loki-config.yaml
    dest: '{{ p_dirs.apps_data }}/observability/loki/config/loki-config.yaml'
    mode: '{{ p_default_permissions.file }}'
    owner: '{{ p_apps_user.user }}'
    group: '{{ p_apps_user.group }}'
  become: true
