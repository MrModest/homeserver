---
# compose_up.yml creates the dataset and the data directories too, but
# config.yaml has to exist as a *file* before compose runs: Docker creates a
# missing bind-mount source as a root-owned directory, and CLIProxyAPI would
# then start with no config at all.
- name: Create ZFS dataset for 'cliproxy'
  community.general.zfs:
    name: '{{ p_dirs.apps_data_ds }}/cliproxy'
    state: present
  become: true

- name: Create the CLIProxyAPI config directory
  ansible.builtin.file:
    path: '{{ p_dirs.apps_data }}/cliproxy/cli-proxy-api'
    state: directory
    owner: '{{ p_apps_user.user }}'
    group: '{{ p_apps_user.group }}'
    mode: '{{ p_default_permissions.directory }}'
  become: true

- name: Upload the CLIProxyAPI config
  # Holds the management key and the client API key, so it is templated
  # rather than copied, and kept at 0600 instead of the repo's usual 0644.
  ansible.builtin.template:
    src: config.yaml.j2
    dest: '{{ p_dirs.apps_data }}/cliproxy/cli-proxy-api/config.yaml'
    owner: '{{ p_apps_user.user }}'
    group: '{{ p_apps_user.group }}'
    mode: '0600'
  become: true

- name: Create the credential directory
  # compose_up.yml creates this too, but seeding a credential into it has to
  # happen before the container starts.
  ansible.builtin.file:
    path: '{{ p_dirs.apps_data }}/cliproxy/cli-proxy-api/auths'
    state: directory
    owner: '{{ p_apps_user.user }}'
    group: '{{ p_apps_user.group }}'
    mode: '{{ p_default_permissions.directory }}'
  become: true
  when: cpa_codex_auth_json | length > 0

- name: Seed the Codex credential
  # force: false is the whole point — CLIProxyAPI rewrites this file as it
  # refreshes the OAuth token, so a copy from the vault is a first-boot seed,
  # never a desired state. Overwriting it on every run would roll the live
  # token back to whatever was captured at seeding time.
  ansible.builtin.copy:
    content: '{{ cpa_codex_auth_json }}'
    dest: '{{ p_dirs.apps_data }}/cliproxy/cli-proxy-api/auths/{{ cpa_codex_auth_name }}'
    owner: '{{ p_apps_user.user }}'
    group: '{{ p_apps_user.group }}'
    mode: '0600'
    force: false
  become: true
  no_log: true
  when: cpa_codex_auth_json | length > 0

- name: Start 'cliproxy'
  ansible.builtin.import_tasks: tasks/compose_up.yml
  vars:
    t_app_name: 'cliproxy'
    t_app_data_dirs:
      - '{{ p_dirs.apps_data }}/cliproxy/cli-proxy-api/auths'
      - '{{ p_dirs.apps_data }}/cliproxy/cli-proxy-api/plugins'
      - '{{ p_dirs.apps_data }}/cliproxy/cpa-manager-plus'
      - '{{ p_dirs.apps_data }}/cliproxy/open-webui'
