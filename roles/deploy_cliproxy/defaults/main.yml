---
cpa_cliproxy_version: 'v7.2.141'
# CPAMP needs CLIProxyAPI v7.1.39+; its HTTP usage queue needs v6.10.8+.
cpa_manager_version: 'v1.12.3'
cpa_open_webui_version: 'v0.11.0'

# Public hostname Caddy serves Open WebUI on. Only used to set WEBUI_URL,
# which Open WebUI puts into the links it generates.
cpa_open_webui_host: placeholder

# CLIProxyAPI Management API key. CPAMP authenticates with this to read and
# write CPA's config, credentials and usage queue.
cpa_management_key: placeholder
# Client key for the OpenAI/Gemini/Claude-compatible API. Anything calling the
# proxy (Open WebUI, Codex CLI, a coding agent) sends this as its API key.
cpa_api_key: placeholder
# Logs into the CPAMP panel.
cpa_manager_admin_key: placeholder
# Signs Open WebUI's JWTs and encrypts its secrets at rest.
cpa_open_webui_secret_key: placeholder

# Optional: raw contents of a Codex credential JSON, to seed the account
# without any interactive login on the server. Written into auths/ only when
# that file does not already exist, so CLIProxyAPI's own token refreshes are
# never clobbered by a stale copy from the vault. Leave empty to log in
# interactively instead — see README.
cpa_codex_auth_json: ''
cpa_codex_auth_name: 'codex.json'

# Open WebUI has no users on a fresh deploy and the first account to sign up
# becomes the admin, so signup starts open. Set this to false in main.yml once
# that account exists and re-run — with ENABLE_PERSISTENT_CONFIG off the
# environment is authoritative, so this cannot be re-opened from the admin UI.
cpa_open_webui_enable_signup: true
