---
cpa_cliproxy_version: 'v7.2.141'
# CPAMP needs CLIProxyAPI v7.1.39+; its HTTP usage queue needs v6.10.8+.
cpa_manager_version: 'v1.12.3'
cpa_open_webui_version: 'v0.11.0'

# Public hostname Caddy serves Open WebUI on. Sets WEBUI_URL.
cpa_open_webui_host: placeholder

# CLIProxyAPI Management API key. CPAMP authenticates with it.
cpa_management_key: placeholder
# Client keys for the proxy's API, keyed by the tool that uses them. CPAMP
# attributes usage to the key a request arrived with, so one key per tool keeps
# them separable in its reports.
cpa_api_keys:
  open-webui: placeholder
# Which entry above Open WebUI authenticates with.
cpa_open_webui_api_key_name: 'open-webui'
# Logs into the CPAMP panel.
cpa_manager_admin_key: placeholder
# Signs Open WebUI's JWTs and encrypts its secrets at rest.
cpa_open_webui_secret_key: placeholder

# The first account to sign up becomes the admin. Set false in main.yml once
# that account exists.
cpa_open_webui_enable_signup: true
